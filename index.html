  return /^[0-9a-f]{6}$/i.test(s) ? "#" + s.toUpperCase() : null;
}
const toRgb = (hex) => { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const rgbToHex = (r, g, b) => "#" + [r, g, b].map((x) => clamp(Math.round(x), 0, 255).toString(16).padStart(2, "0")).join("").toUpperCase();

function hexToHsl(hex) {
  const [R, G, B] = toRgb(hex);
  const r = R / 255, g = G / 255, b = B / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const l = (max + min) / 2, d = max - min;
  let h = 0, s = 0;
  if (d !== 0) {
    s = d / (1 - Math.abs(2 * l - 1));
    if (max === r) h = ((g - b) / d) % 6; else if (max === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return { h, s, l };
}

function textOn(hex) {
  const lin = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  const [r, g, b] = toRgb(hex);
  return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b) > 0.4 ? "#1f1b16" : "#ffffff";
}

/* Klasifikasi HSL: neutral | pastel | earth (muted) | bold (vibrant) */
function describe(hex) {
  const { h, s, l } = hexToHsl(hex);
  let g;
  if (s <= 0.12 || l < 0.12 || l > 0.93) g = "neutral";                              // hitam, putih, abu
  else if (h >= 205 && h <= 225 && s >= 0.4 && s <= 0.9 && l >= 0.3 && l <= 0.55) g = "neutral"; // denim
  else if (h <= 40 && s < 0.65 && l >= 0.2 && l <= 0.5) g = "neutral";                // mocca, coklat tua
  else if (l < 0.24) g = "neutral";                                                  // navy, espresso, dark grey
  else if (h >= 35 && h <= 65 && l >= 0.74) g = "neutral";                           // cream, beige, khaki
  else if ((l > 0.7 && s < 0.5) || (l >= 0.7 && s <= 0.95) || l >= 0.78) g = "pastel";
  else if (h >= 55 && h <= 75 && l < 0.55) g = "earth";                              // olive
  else if (s < 0.6 && (h <= 60 || h >= 330 || s < 0.4) && l >= 0.2 && l <= 0.72) g = "earth";
  else g = "bold";
  return { hex, h, s, l, g, neutral: g === "neutral" };
}

function nearestPreset(hex) {
  const [r, g, b] = toRgb(hex);
  let best = null, bd = Infinity;
  COLORS.forEach((c) => {
    const [r2, g2, b2] = toRgb(c.hex);
    const d = Math.sqrt((r - r2) ** 2 + (g - g2) ** 2 + (b - b2) ** 2);
    if (d < bd) { bd = d; best = c; }
  });
  return { preset: best, dist: bd };
}
function colorName(hex) {
  const { preset, dist } = nearestPreset(hex);
  if (dist === 0) return preset.name;
  return dist < 45 ? `≈ ${preset.name}` : `${tr("Custom")} · ${preset.name}`;
}

/* ---------- CIELAB + CIEDE2000 ---------- */
function hexToLab(hex) {
  const lin = (v) => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  const [r, g, b] = toRgb(hex).map(lin);
  const X = (r * 0.4124564 + g * 0.3575761 + b * 0.1804375) * 100;   // sRGB -> XYZ (D65)
  const Y = (r * 0.2126729 + g * 0.7151522 + b * 0.0721750) * 100;
  const Z = (r * 0.0193339 + g * 0.1191920 + b * 0.9503041) * 100;
  const f = (t) => (t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116);
  const fx = f(X / 95.047), fy = f(Y / 100), fz = f(Z / 108.883);
  const L = 116 * fy - 16, a = 500 * (fx - fy), bb = 200 * (fy - fz);
  return { L, a, b: bb, C: Math.hypot(a, bb), h: (Math.atan2(bb, a) * 180 / Math.PI + 360) % 360 };
}

// Delta E (CIE76): jarak Euclidean di ruang CIELAB
const deltaE = (p, q) => Math.sqrt((p.L - q.L) ** 2 + (p.a - q.a) ** 2 + (p.b - q.b) ** 2);

// Aturan evaluasi pasangan S_ij
function pairScore(A, B) {
  const dE = deltaE(A.lab, B.lab), dL = Math.abs(A.lab.L - B.lab.L);
  if (dE >= 15 && dE <= 45 && dL >= 12) return { score: 100, dE, dL, tag: "ideal" };
  if (dE < 15 && dL < 10) return { score: 40, dE, dL, tag: "dead" };     // monoton / mati
  if (dE > 55) return { score: 30, dE, dL, tag: "sharp" };               // tabrakan tajam
  return { score: 75, dE, dL, tag: "ok" };
}

// Bobot visual: Baju-Celana 50%, Kerudung-Baju 35%, Kerudung-Celana 15%
const PAIR_DEFS = [
  { i: 1, j: 2, w: 0.5 },
  { i: 0, j: 1, w: 0.35 },
  { i: 0, j: 2, w: 0.15 },
];

function analyze(hexes) {
  const info = hexes.map((h) => ({ ...describe(h), lab: hexToLab(h) }));
  const pairs = PAIR_DEFS.map((p) => ({ ...p, ...pairScore(info[p.i], info[p.j]) }));
  const base = pairs.reduce((sum, p) => sum + p.score * p.w, 0);

  const chroma = info.map((c, i) => ({ ...c, i })).filter((c) => !c.neutral);
  const neutralCount = 3 - chroma.length;
  const reasons = [];

  // P_sat: >= 2 elemen non-netral dengan Saturation HSL > 65%  ->  -35
  const loud = chroma.filter((c) => c.s > 0.65);
  const sat = loud.length >= 2 ? 35 : 0;
  if (sat) reasons.push({ type: "sat", slots: loud.map((c) => c.i), amount: sat });

  // P_clash: hue 70-110 derajat antar 2 warna non-netral, tanpa elemen netral  ->  -30
  let clash = 0;
  if (neutralCount === 0) {
    for (let a = 0; a < chroma.length && !clash; a++)
      for (let b = a + 1; b < chroma.length && !clash; b++) {
        const d = hueDist(chroma[a].h, chroma[b].h);
        if (d >= 70 && d <= 110) { clash = 30; reasons.push({ type: "clash", slots: [chroma[a].i, chroma[b].i], deg: Math.round(d), amount: 30 }); }
      }
  }

  // B_neutral: +15 jika 1 netral, +25 jika >= 2 netral
  const bonus = neutralCount >= 2 ? 25 : neutralCount === 1 ? 15 : 0;
  pairs.forEach((p) => { if (p.tag === "dead" || p.tag === "sharp") reasons.push({ type: p.tag, pair: p, amount: 100 - p.score }); });
  reasons.sort((x, y) => y.amount - x.amount);

  const score = Math.round(clamp(base - sat - clash + bonus, 10, 100));
  return { score, info, pairs, reasons, neutralCount, adj: { base: Math.round(base), sat, clash, bonus } };
}

function getVibe(an) {
  const { info, score, neutralCount } = an;
  const colored = info.filter((c) => !c.neutral);
  const spread = colored.length > 1 ? Math.max(...colored.flatMap((a) => colored.map((b) => hueDist(a.h, b.h)))) : 0;
  const lightRange = Math.max(...info.map((c) => c.lab.L)) - Math.min(...info.map((c) => c.lab.L));
  const darkN = info.filter((c) => c.neutral && c.l < 0.22).length;
  const mambaAccent = colored.some((c) => c.g === "bold" && ((c.h >= 255 && c.h <= 300) || (c.h >= 40 && c.h <= 55)));
  const earth = info.filter((c) => c.g === "earth" || (c.neutral && c.h >= 15 && c.h <= 65 && c.s >= 0.12)).length;

  if (an.reasons.some((r) => r.type === "clash") || score < 40) return "Warna Tabrakan";
  if (score < 75) return "Masih Eksperimen";
  if (neutralCount === 3) return "Monochrome Casual";
  if (darkN >= 2 && mambaAccent) return "Cewek Mamba";
  if (colored.length >= 2 && spread <= 40 && lightRange >= 15) return "Tone-on-Tone";
  if (earth >= 2) return "Earth Tone Warm";
  if (info.filter((c) => c.g === "pastel").length >= 2) return "Soft Pastel";
  if (info.some((c) => c.hex === "#1560BD")) return "Denim Day";
  if (colored.length === 1) return "Pop of Color";
  return "Casual Mix";
}

function getNotes(an, hexes) {
  const nm = (i) => `${SLOTS[i].short} (${colorName(hexes[i]).replace("≈ ", "")})`;
  return an.reasons.map((r) => {
    if (r.type === "sat") return tr("Stacked loud colors: {names} are both very saturated. Lower one's saturation or swap it for a neutral.", { names: r.slots.map(nm).join(" & ") });
    if (r.type === "clash") return tr("{a} and {b} clash on the color wheel with no neutral to balance them. Add black, cream, or denim.", { a: nm(r.slots[0]), b: nm(r.slots[1]) });
    const a = SLOTS[r.pair.i].word, b = SLOTS[r.pair.j].word;
    if (r.type === "dead") return tr("Dead contrast: the {a} and {b} are almost the same color and lightness. Vary the brightness.", { a, b });
    return tr("{a} and {b} contrast too much. Pick a closer color or a neutral.", { a: SLOTS[r.pair.i].short, b });
  });
}

function getTip(an, hexes) {
  if (an.score >= 75) return tr("A great match, easy on the eyes!");
  const parts = getNotes(an, hexes);
  return parts.length ? parts[0] : tr("Decent, but not ideal yet. Adjust the color distance and brightness contrast between pieces.");
}

/* Saran perbaikan satu ketukan: ganti 1 slot (yang tidak terkunci) dengan preset terbaik */
function suggestFixes(hexes, locks, pal) {
  const cur = analyze(hexes).score;
  const out = [];
  hexes.forEach((h, i) => {
    if (locks[i]) return;
    let best = null;
    pal[i].forEach((c) => {
      if (c.hex === h) return;
      const sc = analyze(hexes.map((x, k) => (k === i ? c.hex : x))).score;
      if (!best || sc > best.score) best = { slot: i, color: c, score: sc };
    });
    if (best && best.score - cur >= 4) out.push({ ...best, gain: best.score - cur });
  });
  return out.sort((a, b) => b.gain - a.gain);
}

const isDark = () => document.documentElement.classList.contains("dark");
const scoreTone = (s) => {
  const d = isDark();
  return s >= 80 ? { c: d ? "#8fd0a8" : "#4f9b72", bg: d ? "rgba(110,190,145,.16)" : "#e3f3ea", t: tr("Great match") }
    : s >= 70 ? { c: d ? "#e8c27a" : "#a9803a", bg: d ? "rgba(225,185,100,.16)" : "#f8eed9", t: tr("Pretty good") }
    : { c: d ? "#f0899d" : "#c4566f", bg: d ? "rgba(235,110,135,.16)" : "#fbe4e9", t: tr("Needs work") };
};

const randFrom = (list) => { const l = list.length ? list : defaultPalette(); return l[Math.floor(Math.random() * l.length)].hex; };
function randomOutfit(current, locked, pal) {
  const cands = [];
  for (let n = 0; n < 400; n++) {
    const hs = current.map((h, i) => (locked[i] ? h : randFrom(pal[i])));
    cands.push({ hs, score: analyze(hs).score });
  }
  cands.sort((a, b) => b.score - a.score);
  let pool = cands.filter((c) => c.score >= 78 && c.hs.join() !== current.join()).slice(0, 15);
  if (!pool.length) pool = cands.slice(0, 5);
  return pool[Math.floor(Math.random() * pool.length)].hs;
}

          style={{ background: matched ? "conic-gradient(#f43f5e,#f59e0b,#84cc16,#06b6d4,#6366f1,#d946ef,#f43f5e)" : hex }}>

    { id: "clash", k: tr("Hue clash"), v: -an.adj.clash, c: "bg-red-50 text-red-600", show: an.adj.clash > 0 },
    { id: "bonus", k: tr("Neutral bonus"), v: an.adj.bonus, c: "bg-green-50 text-green-700", show: an.adj.bonus > 0 },

    <div>
      <div className="space-y-2.5">

                <span className="font-semibold" style={{ color: t.c }}>{tagText(p)} · {Math.round(p.score)} <span className="font-mono text-[11px] font-normal text-stone-400">ΔE {p.dE.toFixed(0)}</span></span>
              </div>
              <div className="mt-1 h-2 overflow-hidden rounded-full bg-stone-100">

        ))}
      </div>
      {notes.length > 0 && (
        <ul className="mt-3 space-y-1.5 text-xs leading-relaxed text-stone-600">
          {notes.map((n, i) => <li key={i} className="flex gap-2"><span aria-hidden>•</span><span>{n}</span></li>)}
        </ul>
      )}
      <div className="mt-3 border-t border-stone-100 pt-3">

          : fixes.length === 0 ? <p className="mt-1 text-xs text-stone-400">{tr("No single-color swap would raise the score meaningfully.")}</p>
          : <div className="mt-1.5 flex flex-wrap gap-2">
              {fixes.map((f) => (
                <button key={f.slot} onClick={() => onApply(f.slot, f.color.hex)}
                  className="flex items-center gap-2 rounded-2xl bg-stone-50 py-1.5 pl-1.5 pr-3 text-xs font-bold ring-1 ring-stone-200 transition active:scale-95">
                  <span className="h-6 w-6 rounded-full ring-1 ring-black/10" style={{ backgroundColor: f.color.hex }} />
                  <span>{SLOTS[f.slot].short} → {f.color.name}</span>
                  <span className="text-green-600">+{f.gain}%</span>

              ))}

}

function ScoreRing({ score }) {
  const t = scoreTone(score), r = 22, C = 2 * Math.PI * r;
  return (
    <div className="relative h-14 w-14 shrink-0">
      <svg viewBox="0 0 56 56" className="h-14 w-14 -rotate-90">
        <circle cx="28" cy="28" r={r} fill="none" stroke={isDark() ? "#43363e" : "#f3e4e8"} strokeWidth="6" />
        <circle cx="28" cy="28" r={r} fill="none" stroke={t.c} strokeWidth="6" strokeLinecap="round"

}

/* ---------- Modal: Scan Warna dari Foto ---------- */
function ScanModal({ open, onClose, locks, initialSlot, onApply }) {
  const canvasRef = useRef(null);
  const imgRef = useRef(null);
  const [hasImg, setHasImg] = useState(false);
  const [picked, setPicked] = useState(null);
  const [target, setTarget] = useState(initialSlot);

  useEffect(() => { if (open) { setTarget(locks[initialSlot] ? Math.max(0, locks.findIndex((l) => !l)) : initialSlot); } }, [open, initialSlot]);

  const drawBase = () => {
    const cv = canvasRef.current, img = imgRef.current;
    if (!cv || !img) return null;
    const maxW = Math.min(window.innerWidth - 56, 440), maxH = Math.round(window.innerHeight * 0.4);
    const sc = Math.min(maxW / img.width, maxH / img.height);
    const w = Math.max(1, Math.round(img.width * sc)), h = Math.max(1, Math.round(img.height * sc));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    const ctx = cv.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, w, h);
    return ctx;
  };

  useEffect(() => {
    if (!hasImg) return;
    const ctx = drawBase();
    if (ctx && picked) {
      ctx.lineWidth = 4; ctx.strokeStyle = "#fff"; ctx.beginPath(); ctx.arc(picked.x, picked.y, 13, 0, 7); ctx.stroke();
      ctx.lineWidth = 2; ctx.strokeStyle = "#111"; ctx.beginPath(); ctx.arc(picked.x, picked.y, 15, 0, 7); ctx.stroke();
      ctx.fillStyle = picked.hex; ctx.beginPath(); ctx.arc(picked.x, picked.y, 10, 0, 7); ctx.fill();
    }
  }, [hasImg, picked, open]);

  const onFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => { imgRef.current = img; setPicked(null); setHasImg(true); URL.revokeObjectURL(url); };
    img.src = url;
    e.target.value = "";
  };

  const pick = (e) => {
    const cv = canvasRef.current;
    if (!cv || !imgRef.current) return;
    const rect = cv.getBoundingClientRect();
    const x = clamp(Math.round((e.clientX - rect.left) * cv.width / rect.width), 0, cv.width - 1);
    const y = clamp(Math.round((e.clientY - rect.top) * cv.height / rect.height), 0, cv.height - 1);
    const ctx = drawBase(); // baca piksel dari gambar bersih (tanpa penanda)
    const x0 = clamp(x - 2, 0, cv.width - 5), y0 = clamp(y - 2, 0, cv.height - 5);
    const d = ctx.getImageData(x0, y0, Math.min(5, cv.width), Math.min(5, cv.height)).data;
    let r = 0, g = 0, b = 0, n = d.length / 4;
    for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
    setPicked({ x, y, hex: rgbToHex(r / n, g / n, b / n) });
  };

  if (!open) return null;
  const allLocked = locks.every(Boolean);
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/50 sm:items-center" onClick={onClose}>
      <div className="slide-up max-h-[92vh] w-full max-w-lg overflow-y-auto rounded-t-3xl bg-white p-4 shadow-2xl sm:rounded-3xl" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between">
          <h2 className="flex items-center gap-2 text-base font-extrabold"><Icon name="camera" size={18} /> {tr("Scan colors from a photo")}</h2>
          <button onClick={onClose} aria-label={tr("Close")} className="rounded-full bg-stone-100 p-2"><Icon name="x" size={16} /></button>
        </div>
        <p className="mt-1 text-xs text-stone-500">{tr("Upload a photo of a top or hijab, then tap anywhere to pick its true color.")}</p>

        <label className="mt-3 flex cursor-pointer items-center justify-center gap-2 rounded-2xl border-2 border-dashed border-stone-300 py-3 text-sm font-bold text-stone-600 hover:bg-stone-50">
          <Icon name="image" size={18} /> {hasImg ? tr("Change photo") : tr("Choose a photo from your gallery")}
          <input type="file" accept="image/*" className="hidden" onChange={onFile} />
        </label>

        {hasImg && (
          <div className="mt-3 flex justify-center rounded-2xl bg-stone-100 p-2">
            <canvas ref={canvasRef} className="max-w-full cursor-crosshair rounded-xl" style={{ touchAction: "none" }}
              onPointerDown={(e) => { e.currentTarget.setPointerCapture(e.pointerId); pick(e); }}
              onPointerMove={(e) => e.buttons > 0 && pick(e)} />
          </div>
        )}

        {hasImg && (
          <div className="mt-3 flex items-center gap-3 rounded-2xl bg-stone-50 p-3">
            <div className="fade-bg h-12 w-12 shrink-0 rounded-xl ring-1 ring-black/10" style={{ backgroundColor: picked ? picked.hex : "#f3e4e8" }} />
            <div className="leading-tight">
              <p className="font-mono text-base font-bold">{picked ? picked.hex : tr("Tap the photo…")}</p>
              {picked && <p className="text-xs text-stone-500">{colorName(picked.hex)} · {groupLabel(describe(picked.hex).g)}</p>}
            </div>
          </div>
        )}

        <p className="mt-3 text-xs font-bold text-stone-500">{tr("Apply to slot")}</p>
        <div className="mt-1.5 flex flex-wrap gap-1.5">
          {SLOTS.map((s, i) => (
            <button key={s.key} disabled={locks[i]} onClick={() => setTarget(i)}
              className={`flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-bold transition ${target === i && !locks[i] ? "bg-stone-900 text-white" : "bg-stone-100 text-stone-600"} ${locks[i] ? "opacity-40" : ""}`}>
              {locks[i] && <Icon name="lock" size={11} />} {s.short}
            </button>
          ))}
        </div>
        <button disabled={!picked || allLocked || locks[target]} onClick={() => { onApply(target, picked.hex); onClose(); }}
          className="mt-4 w-full rounded-2xl bg-rose-500 hover:bg-rose-600 py-3 text-sm font-extrabold text-white shadow transition active:scale-95 disabled:opacity-40">
          {tr("Apply color to {slot}", { slot: SLOTS[target].short })}
        </button>
      </div>
    </div>
  );
}

/* ---------- Pilih banyak (checkbox + pilih semua + hapus) ---------- */
function Box({ checked, partial }) {
  return (
    <span className={`flex h-5 w-5 shrink-0 items-center justify-center rounded-md border-2 transition ${checked || partial ? "border-rose-500 bg-rose-500 text-white" : "border-stone-300 bg-white"}`}>
      {checked ? <Icon name="check" size={13} /> : partial ? <span className="h-0.5 w-2.5 rounded bg-white" /> : null}
    </span>
  );
}

function SelectBar({ total, count, busy, onToggleAll, onDelete, onCancel }) {
  const [confirm, setConfirm] = useState(false);
  useEffect(() => { setConfirm(false); }, [count]);
  useEffect(() => { if (!confirm) return; const t = setTimeout(() => setConfirm(false), 3000); return () => clearTimeout(t); }, [confirm]);
  const all = total > 0 && count === total;
  return (
    <div className="flex flex-wrap items-center gap-x-3 gap-y-2 rounded-2xl bg-white p-2.5 ring-1 ring-stone-200">
      <button onClick={onToggleAll} role="checkbox" aria-checked={all} className="flex items-center gap-2 text-xs font-bold text-stone-700">
        <Box checked={all} partial={count > 0 && !all} /> {tr("Select all")}
      </button>
      <span className="text-xs text-stone-500">{tr("{n} selected", { n: count })}</span>
      <span className="ml-auto flex gap-2">
        <button disabled={!count || busy} onClick={() => (confirm ? (setConfirm(false), onDelete()) : setConfirm(true))}
          className={`flex items-center gap-1.5 rounded-xl px-3 py-2 text-xs font-bold transition active:scale-95 disabled:opacity-40 ${confirm ? "bg-red-600 text-white" : "bg-red-50 text-red-600"}`}>
          <Icon name="trash" size={14} /> {busy ? tr("Deleting…") : confirm ? tr("Really delete {n}?", { n: count }) : tr("Delete ({n})", { n: count })}
        </button>
        <button onClick={onCancel} className="rounded-xl bg-stone-100 px-3 py-2 text-xs font-bold text-stone-600">{tr("Cancel")}</button>
      </span>
    </div>
  );
}

/* ---------- Lemari Digital ---------- */
const VIEW_KEY = "ootd-match-mix-lab:view:v1";
const SORTS = [["new", "Newest"], ["old", "Oldest"], ["high", "Highest score"], ["low", "Lowest score"]];
const FILTERS = ["Semua", ...TAGS, "Tanpa tag"];
const itemTs = (it) => { if (it.ts) return it.ts; const n = parseInt(it.id, 36); return Number.isFinite(n) && n > 1e12 ? n : 0; };
function loadView() {
  try {
    const v = JSON.parse(localStorage.getItem(VIEW_KEY) || "{}");
    return { filter: FILTERS.includes(v.filter) ? v.filter : "Semua", sort: SORTS.some((x) => x[0] === v.sort) ? v.sort : "new" };
  } catch { return { filter: "Semua", sort: "new" }; }
}

function Wardrobe({ items, onUse, onDelete, onDeleteMany, onTag }) {
  const [confirmId, setConfirmId] = useState(null);
  const [selMode, setSelMode] = useState(false);
  const [sel, setSel] = useState(() => new Set());
  const [busy, setBusy] = useState(false);
  const [view, setView] = useState(loadView);
  useEffect(() => { try { localStorage.setItem(VIEW_KEY, JSON.stringify(view)); } catch {} }, [view]);

  const counts = useMemo(() => {
    const c = { Semua: items.length, "Tanpa tag": items.filter((i) => !i.tag).length };
    TAGS.forEach((t) => { c[t] = items.filter((i) => i.tag === t).length; });
    return c;
  }, [items]);

  const visible = useMemo(() => {
    const f = items.filter((i) => view.filter === "Semua" || (view.filter === "Tanpa tag" ? !i.tag : i.tag === view.filter));
    const by = { new: (a, b) => itemTs(b) - itemTs(a), old: (a, b) => itemTs(a) - itemTs(b), high: (a, b) => b.score - a.score || itemTs(b) - itemTs(a), low: (a, b) => a.score - b.score || itemTs(b) - itemTs(a) }[view.sort];
    return [...f].sort(by);
  }, [items, view]);

  useEffect(() => {   // buang pilihan yang tidak lagi terlihat (dihapus / terfilter)
    setSel((prev) => { const next = new Set([...prev].filter((id) => visible.some((i) => i.id === id))); return next.size === prev.size ? prev : next; });
    if (!items.length) setSelMode(false);
  }, [visible, items.length]);

  const toggle = (id) => setSel((prev) => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const exitSel = () => { setSelMode(false); setSel(new Set()); };
  const deleteSelected = async () => {
    setBusy(true);
    try { if (await onDeleteMany([...sel])) exitSel(); } finally { setBusy(false); }
  };

  if (!items.length)
    return (
      <div className="slide-up mt-16 flex flex-col items-center text-center text-stone-500">
        <div className="mb-4 flex h-20 w-20 items-center justify-center rounded-full bg-stone-100"><Icon name="archive" size={36} /></div>
        <p className="font-bold text-stone-700">{tr("Your wardrobe is empty")}</p>
        <p className="mt-1 max-w-xs text-sm">{tr("Put together an outfit in Mix Lab, then tap Save to keep it here.")}</p>
      </div>
    );
  return (
    <div className="space-y-3">
      {/* filter tag */}
      <div className="no-scrollbar -mx-4 flex gap-2 overflow-x-auto px-4 py-0.5">
        {FILTERS.map((f) => (
          <button key={f} onClick={() => setView((v) => ({ ...v, filter: f }))} aria-pressed={view.filter === f}
            className={`shrink-0 rounded-full px-3.5 py-2 text-xs font-bold transition ${view.filter === f ? "bg-stone-900 text-white" : "bg-white text-stone-600 ring-1 ring-stone-200"}`}>
            {filterLabel(f)} <span className="opacity-60">{counts[f]}</span>
          </button>
        ))}
      </div>

      {selMode ? (
        <div className="sticky top-[56px] z-10">
          <SelectBar total={visible.length} count={sel.size} busy={busy}
            onToggleAll={() => setSel(sel.size === visible.length ? new Set() : new Set(visible.map((i) => i.id)))}
            onDelete={deleteSelected} onCancel={exitSel} />
        </div>
      ) : (
        <div className="flex items-center justify-between gap-2">
          <label className="flex items-center gap-2 text-xs font-semibold text-stone-500">
            {tr("Sort by")}
            <select value={view.sort} onChange={(e) => setView((v) => ({ ...v, sort: e.target.value }))}
              className="rounded-xl bg-white py-2 pl-3 pr-2 text-xs font-bold text-stone-700 ring-1 ring-stone-200">
              {SORTS.map(([k, l]) => <option key={k} value={k}>{tr(l)}</option>)}
            </select>
          </label>
          <button onClick={() => setSelMode(true)} className="flex items-center gap-1.5 rounded-xl bg-white px-3 py-2 text-xs font-bold text-stone-600 ring-1 ring-stone-200 transition active:scale-95">
            <Icon name="check" size={14} /> {tr("Select")}
          </button>
        </div>
      )}

      {visible.length === 0 && (
        <div className="slide-up rounded-3xl bg-white p-6 text-center text-sm text-stone-500 ring-1 ring-stone-200">
          {tr("No outfits match the “{f}” filter.", { f: filterLabel(view.filter) })}
          <button onClick={() => setView((v) => ({ ...v, filter: "Semua" }))} className="mt-3 block w-full rounded-2xl bg-stone-900 py-2.5 text-xs font-bold text-white">{tr("Show all")}</button>
        </div>
      )}

      {visible.map((it) => {
        const t = scoreTone(it.score);
        const checked = sel.has(it.id);
        return (
          <div key={it.id} onClick={selMode ? () => toggle(it.id) : undefined}
            className={`slide-up rounded-3xl bg-white p-3.5 shadow-sm ring-1 transition ${selMode ? "cursor-pointer" : ""} ${checked ? "ring-2 ring-rose-400" : "ring-stone-200"}`}>
            {selMode && <div className="mb-2.5 flex items-center gap-2 text-xs font-bold text-stone-600"><Box checked={checked} /> {checked ? tr("Selected") : tr("Select this outfit")}</div>}
            <div className="flex gap-3">
              <div className="pointer-events-none h-[148px] w-[70px] shrink-0 rounded-2xl bg-[#f7e8ec] p-1">
                <Mannequin hexes={it.colors} active={-1} />
              </div>
              <div className="flex min-w-0 flex-1 flex-col">
                <div className="flex items-start justify-between gap-2">
                  <div className="min-w-0">
                    <p className="truncate font-bold text-stone-800">{vibeText(it.vibe)}</p>
                    <p className="text-xs text-stone-500">{itemTs(it) ? fmtDate(itemTs(it)) : it.date}{it.tag ? <span className="ml-2 rounded-full bg-stone-100 px-2 py-0.5 text-[11px] font-semibold text-stone-500">{tagLabel(it.tag)}</span> : null}</p>
                  </div>
                  <span className="shrink-0 rounded-full px-2.5 py-1 text-sm font-extrabold" style={{ color: t.c, backgroundColor: t.bg }}>{it.score}%</span>
                </div>
                <div className="mt-2.5 space-y-1">
                  {it.colors.map((h, i) => (
                    <div key={i} className="flex items-center gap-2 text-[11px] text-stone-500">
                      <span className="h-4 w-4 shrink-0 rounded-full ring-1 ring-black/10" style={{ backgroundColor: h }} />
                      <span className="w-14 shrink-0">{SLOTS[i].short}</span><span className="font-mono">{h}</span>
                    </div>
                  ))}
                </div>
                {!selMode && (
                  <div className="mt-auto flex gap-2 pt-2.5">
                    <button onClick={() => onUse(it)} className="flex h-10 flex-1 items-center justify-center gap-1.5 rounded-xl bg-stone-900 text-xs font-bold text-white transition active:scale-95">
                      <Icon name="redo" size={14} /> {tr("Use")}
                    </button>
                    <button onClick={() => {
                        if (confirmId === it.id) { onDelete(it.id); setConfirmId(null); }
                        else { setConfirmId(it.id); setTimeout(() => setConfirmId((c) => (c === it.id ? null : c)), 2500); }
                      }}

                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

const must = ({ data, error }) => { if (error) throw error; return data; };

  // Fungsi 1: akun pengguna (profil + waktu login terakhir)

  loadDefaults: async () => {
    const m = Object.fromEntries(must(await sb.from("user_defaults").select("slot,hex")).map((r) => [r.slot, r.hex]));

    return arr.every(Boolean) ? arr : null;

};

function loadWardrobe() {
  try {
    const v = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    if (!Array.isArray(v)) return [];
    return v.map((it) => {
      // migrasi: id preset lama -> HEX, dan outfit 5 elemen lama -> 3 elemen pertama
      const colors = (it.colors || []).slice(0, 3).map((c) => normHex(c) || (BY_ID[c] && BY_ID[c].hex));
      return colors.length === 3 && colors.every(Boolean) ? { ...it, colors } : null;
    }).filter(Boolean);
  } catch { return []; }
}

/* ---------- Modal akun: masuk / daftar (email + password) & keluar ---------- */
function AuthModal({ open, onClose, user, onSignOut }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [mode, setMode] = useState("masuk");
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);
  useEffect(() => { if (open) setMsg(null); }, [open, mode]);
  if (!open) return null;

  const redirect = window.location.origin + window.location.pathname;
  const isHttp = /^https?:$/.test(window.location.protocol);
  const explain = (e) => {
    const m = (e && e.message) || "";
    if (/invalid login/i.test(m)) return tr("Wrong email or password.");
    if (/not confirmed/i.test(m)) return tr("Email not confirmed. Check your inbox, or turn off \"Confirm email\" in the Supabase dashboard.");
    if (/already registered|already been registered/i.test(m)) return tr("This email is already registered. Please sign in.");
    if (/rate limit/i.test(m)) return tr("Supabase email rate limit reached. Wait a moment, or turn off \"Confirm email\" in the Supabase dashboard.");
    if (/password/i.test(m)) return tr("Password must be at least 6 characters.");
    return m || tr("Something went wrong.");
  };
  const submit = async () => {
    if (!/^\S+@\S+\.\S+$/.test(email)) return setMsg({ t: "err", m: tr("Enter a valid email address.") });
    if (password.length < 6) return setMsg({ t: "err", m: tr("Password must be at least 6 characters.") });
    setBusy(true); setMsg(null);
    try {
      if (mode === "masuk") {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) setMsg({ t: "err", m: explain(error) });
      } else {
        const { data, error } = await sb.auth.signUp({ email, password, options: isHttp ? { emailRedirectTo: redirect } : {} });
        if (error) setMsg({ t: "err", m: explain(error) });
        else if (!data.session) setMsg({ t: "ok", m: tr("Account created. Check your email to confirm, then sign in.") });
      }
    } finally { setBusy(false); }
  };
  const name = user && ((user.user_metadata && (user.user_metadata.full_name || user.user_metadata.name)) || user.email);

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/50 sm:items-center" onClick={onClose}>
      <div className="slide-up w-full max-w-md rounded-t-3xl bg-white p-5 shadow-2xl sm:rounded-3xl" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between">
          <h2 className="flex items-center gap-2 text-base font-extrabold"><Icon name="user" size={18} /> {user ? tr("My account") : tr("Sign in")}</h2>
          <button onClick={onClose} aria-label={tr("Close")} className="rounded-full bg-stone-100 p-2"><Icon name="x" size={16} /></button>
        </div>

        {!sb ? (
          <p className="mt-3 rounded-2xl bg-amber-50 p-3 text-xs leading-relaxed text-amber-900 ring-1 ring-amber-200">
            {tr("Supabase is not configured yet. Set SUPABASE_URL and SUPABASE_ANON_KEY at the top of the script. Until then, data is stored locally in this browser.")}
          </p>
        ) : user ? (
          <div className="mt-4">
            <p className="text-sm font-bold">{name}</p>
            <p className="text-xs text-stone-500">{user.email}</p>
            <p className="mt-2 text-xs text-stone-500">{tr("Your wardrobe and default colors are saved to your account and follow you to every device.")}</p>
            <button onClick={onSignOut} className="mt-4 flex w-full items-center justify-center gap-2 rounded-2xl bg-stone-900 py-3 text-sm font-bold text-white transition active:scale-95">
              <Icon name="logout" size={16} /> {tr("Sign out")}
            </button>
          </div>
        ) : (
          <div className="mt-3">
            <div className="mb-3 grid grid-cols-2 gap-1 rounded-xl bg-stone-100 p-1">
              {[["masuk", tr("Sign in")], ["daftar", tr("Sign up")]].map(([k, l]) => (
                <button key={k} onClick={() => setMode(k)}
                  className={`rounded-lg py-1.5 text-xs font-bold transition ${mode === k ? "bg-white text-stone-900 shadow" : "text-stone-500"}`}>{l}</button>
              ))}
            </div>
            <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()}
              placeholder={tr("name@email.com")} autoComplete="email"
              className="w-full rounded-2xl bg-stone-100 px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-rose-300" />
            <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()}
              placeholder={tr("Password (min. 6 characters)")} autoComplete={mode === "masuk" ? "current-password" : "new-password"}
              className="mt-2 w-full rounded-2xl bg-stone-100 px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-rose-300" />
            <button onClick={submit} disabled={busy}
              className="mt-3 w-full rounded-2xl bg-rose-500 hover:bg-rose-600 py-3 text-sm font-extrabold text-white shadow transition active:scale-95 disabled:opacity-60">
              {busy ? tr("Processing…") : mode === "masuk" ? tr("Sign in") : tr("Create account")}
            </button>
          </div>
        )}
        {msg && <p className={`mt-3 rounded-2xl p-3 text-xs leading-relaxed ${msg.t === "ok" ? "bg-green-50 text-green-700" : "bg-red-50 text-red-600"}`}>{msg.m}</p>}
      </div>
    </div>
  );
}

/* ---------- Modal: ubah palet warna pribadi per slot ---------- */
function PaletteModal({ slot, list, isCustom, onClose, onAdd, onUpdate, onRemove, onRemoveMany, onReset }) {
  const [draft, setDraft] = useState({ index: null, name: "", hex: "#C2185B" });
  const [hexText, setHexText] = useState("#C2185B");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);
  const [selMode, setSelMode] = useState(false);
  const [sel, setSel] = useState(() => new Set());
  useEffect(() => { setSelMode(false); setSel(new Set()); }, [slot && slot.key]);
  useEffect(() => { setSel(new Set()); }, [list.length]);
  useEffect(() => { setDraft({ index: null, name: "", hex: "#C2185B" }); setHexText("#C2185B"); setErr(""); setConfirmReset(false); }, [slot && slot.key]);
  if (!slot) return null;

  const setHex = (v) => { setHexText(v); const h = normHex(v); if (h) setDraft((d) => ({ ...d, hex: h })); };
  const startEdit = (i) => { setDraft({ index: i, name: list[i].name, hex: list[i].hex }); setHexText(list[i].hex); setErr(""); };
  const cancelEdit = () => { setDraft({ index: null, name: "", hex: "#C2185B" }); setHexText("#C2185B"); setErr(""); };
  const run = async (fn) => { setBusy(true); try { return await fn(); } finally { setBusy(false); } };
  const toggleSel = (i) => setSel((p) => { const n = new Set(p); n.has(i) ? n.delete(i) : n.add(i); return n; });
  const exitSel = () => { setSelMode(false); setSel(new Set()); };
  const deleteSelected = async () => { if (await run(() => onRemoveMany([...sel]))) exitSel(); };

  const submit = async () => {
    const hex = normHex(hexText);
    if (!hex) return setErr(tr("Invalid HEX code. Example: #C2185B"));
    const name = draft.name.trim() || colorName(hex).replace(/^≈ /, "");
    setErr("");
    const ok = await run(() => (draft.index === null ? onAdd({ name, hex }) : onUpdate(draft.index, { name, hex })));
    if (ok) cancelEdit();
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/50 sm:items-center" onClick={onClose}>
      <div className="slide-up max-h-[92vh] w-full max-w-md overflow-y-auto rounded-t-3xl bg-white p-5 shadow-2xl sm:rounded-3xl" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between">
          <h2 className="flex items-center gap-2 text-base font-extrabold"><Icon name={slot.icon} size={18} /> {tr("{slot} palette", { slot: slot.short })}</h2>
          <button onClick={onClose} aria-label={tr("Close")} className="rounded-full bg-stone-100 p-2"><Icon name="x" size={16} /></button>
        </div>
        <p className="mt-1 text-xs text-stone-500">
          {isCustom ? tr("This is your personal palette for this slot.") : tr("Currently using the default palette. Your first change creates your own copy.")}
        </p>

        <div className="mt-3">
          {selMode ? (
            <SelectBar total={list.length} count={sel.size} busy={busy}
              onToggleAll={() => setSel(sel.size === list.length ? new Set() : new Set(list.map((_, i) => i)))}
              onDelete={deleteSelected} onCancel={exitSel} />
          ) : (
            <div className="flex items-center justify-between">
              <span className="text-xs font-semibold text-stone-500">{tr("{n} colors", { n: list.length })}</span>
              <button disabled={!list.length} onClick={() => setSelMode(true)} className="flex items-center gap-1.5 rounded-xl bg-stone-100 px-3 py-1.5 text-xs font-bold text-stone-600 disabled:opacity-40">
                <Icon name="check" size={13} /> {tr("Select")}
              </button>
            </div>
          )}
        </div>

        <div className="mt-2 max-h-[34vh] space-y-1.5 overflow-y-auto pr-1">
          {list.length === 0 && <p className="rounded-2xl bg-stone-50 p-4 text-center text-xs text-stone-500">{tr("The palette is empty. Add a new color below, or restore the default palette.")}</p>}
          {list.map((c, i) => (
            <div key={c.id + i} onClick={selMode ? () => toggleSel(i) : undefined}
              className={`flex items-center gap-2.5 rounded-2xl p-1.5 ring-1 ${selMode ? "cursor-pointer" : ""} ${sel.has(i) ? "bg-rose-50 ring-rose-300" : draft.index === i ? "bg-rose-50 ring-rose-300" : "bg-stone-50 ring-stone-100"}`}>
              {selMode && <span className="pl-1"><Box checked={sel.has(i)} /></span>}
              <span className="h-8 w-8 shrink-0 rounded-full ring-1 ring-black/10" style={{ backgroundColor: c.hex }} />
              <span className="min-w-0 flex-1 leading-tight"><span className="block truncate text-sm font-bold">{c.name}</span><span className="block font-mono text-[10px] text-stone-500">{c.hex}</span></span>
              {!selMode && <>
                <button disabled={busy} onClick={() => startEdit(i)} aria-label={tr("Edit {name}", { name: c.name })} className="rounded-full bg-white p-2 text-stone-600 ring-1 ring-stone-200"><Icon name="pencil" size={14} /></button>
                <button disabled={busy} onClick={() => run(() => onRemove(i))} aria-label={tr("Delete {name}", { name: c.name })} className="rounded-full bg-white p-2 text-red-500 ring-1 ring-stone-200"><Icon name="trash" size={14} /></button>
              </>}
            </div>
          ))}
        </div>

        {!selMode && <div className="mt-3 rounded-2xl bg-stone-50 p-3 ring-1 ring-stone-100">
          <p className="text-xs font-bold text-stone-600">{draft.index === null ? tr("Add a new color") : tr("Edit: {name}", { name: list[draft.index] ? list[draft.index].name : "" })}</p>
          <div className="mt-2 flex items-center gap-2">
            <label className="relative h-10 w-10 shrink-0 cursor-pointer overflow-hidden rounded-full ring-2 ring-white shadow" style={{ backgroundColor: draft.hex }}>
              <input type="color" value={draft.hex.toLowerCase()} onChange={(e) => setHex(e.target.value.toUpperCase())} className="absolute inset-0 h-full w-full opacity-0" aria-label={tr("Pick a color")} />
            </label>
            <input value={draft.name} onChange={(e) => setDraft((d) => ({ ...d, name: e.target.value }))} maxLength={24} placeholder={tr("Color name")}
              className="min-w-0 flex-1 rounded-xl bg-white px-3 py-2 text-sm outline-none ring-1 ring-stone-200 focus:ring-2 focus:ring-rose-300" />
            <input value={hexText} onChange={(e) => setHex(e.target.value)} maxLength={7} spellCheck={false}
              className="w-[88px] rounded-xl bg-white px-2 py-2 font-mono text-sm uppercase outline-none ring-1 ring-stone-200 focus:ring-2 focus:ring-rose-300" aria-label={tr("HEX code")} />
          </div>
          {err && <p className="mt-2 text-xs text-red-600">{err}</p>}
          <div className="mt-2.5 flex gap-2">
            <button onClick={submit} disabled={busy} className="flex flex-1 items-center justify-center gap-1.5 rounded-xl bg-stone-900 py-2.5 text-sm font-bold text-white transition active:scale-95 disabled:opacity-60">
              <Icon name={draft.index === null ? "plus" : "save"} size={15} /> {busy ? tr("Saving…") : draft.index === null ? tr("Add") : tr("Save changes")}
            </button>
            {draft.index !== null && <button onClick={cancelEdit} className="rounded-xl bg-white px-4 text-sm font-bold text-stone-600 ring-1 ring-stone-200">{tr("Cancel")}</button>}
          </div>
        </div>}

        <div className="mt-3 flex gap-2">
          {isCustom && (
            <button disabled={busy} onClick={() => { if (!confirmReset) { setConfirmReset(true); setTimeout(() => setConfirmReset(false), 2500); } else { setConfirmReset(false); run(() => onReset()); } }}
              className={`rounded-2xl px-4 py-2.5 text-sm font-bold transition active:scale-95 ${confirmReset ? "bg-red-600 text-white" : "bg-red-50 text-red-600"}`}>
              {confirmReset ? tr("Restore default?") : tr("Restore default")}
            </button>
          )}
          <button onClick={onClose} className="flex-1 rounded-2xl bg-rose-50 py-2.5 text-sm font-bold text-rose-600">{tr("Done")}</button>
        </div>
      </div>
    </div>
  );
}

  const vibe = useMemo(() => getVibe(an), [an]);
  const tip = useMemo(() => getTip(an, hexes), [an, hexes, lang]);
  const tone = scoreTone(an.score);
  const palArrays = useMemo(() => SLOTS.map((sl) => palState.pal[sl.key]), [palState]);
  const fixes = useMemo(() => suggestFixes(hexes, locks, palArrays), [hexes, locks, palArrays]);

  useEffect(() => { document.title = "PaduPadan for Hijabi"; document.documentElement.lang = lang; }, [lang]);
  const toggleLang = () => { const next = LANG === "en" ? "id" : "en"; setLangGlobal(next); setLang(next); };

  const applyTheme = (t) => {
    const dark = t === "dark" || (t === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.classList.toggle("dark", dark);
  };
  const cycleTheme = () => {
    const next = { auto: "light", light: "dark", dark: "auto" }[theme];
    applyTheme(next); setTheme(next);
    try { localStorage.setItem("ootd-match-mix-lab:theme", next); } catch {}
    showToast({ auto: tr("Theme follows your device"), light: tr("Light theme"), dark: tr("Dark theme") }[next]);
  };
  useEffect(() => {   // mode otomatis: ikuti perubahan pengaturan perangkat
    if (theme !== "auto") return;
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const h = () => { applyTheme("auto"); setTick((n) => n + 1); };
    mq.addEventListener("change", h);
    return () => mq.removeEventListener("change", h);
  }, [theme]);

  const showToast = (m) => { setToast(m); timers.current.push(setTimeout(() => setToast(""), 2400)); };
  const setColor = (i, hex) => hex && setHexes((p) => p.map((x, k) => (k === i ? hex : x)));
  const toggleLock = (i) => setLocks((p) => p.map((x, k) => (k === i ? !x : x)));
  const commitLocal = (list) => { setWardrobe(list); try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch {} };

  /* Sesi login */
  useEffect(() => {
    if (!sb) return;
    sb.auth.getSession().then(({ data }) => setUser(data.session ? data.session.user : null));
    const { data } = sb.auth.onAuthStateChange((_e, session) => setUser(session ? session.user : null));
    return () => data.subscription.unsubscribe();
  }, []);

  /* Saat pengguna masuk/keluar: muat lemari + warna default dari akun */
  useEffect(() => {
    if (!sb) return;
    if (!uid) { setDefaults(null); setWardrobe(loadWardrobe()); setPalState(emptyPalState()); return; }
    let cancelled = false;
    (async () => {
      setSyncing(true);
      try {
        DB.touchProfile(user).catch(() => {});
        const local = loadWardrobe();
        if (local.length) {   // pindahkan outfit lokal ke akun, sekali saja
          await DB.addMany(local);
          try { localStorage.removeItem(STORAGE_KEY); } catch {}
          showToast(tr("{n} local outfits moved to your account", { n: local.length }));
        }
        const [list, defs, pals] = await Promise.all([DB.loadOutfits(), DB.loadDefaults(), DB.loadPalettes()]);
        if (cancelled) return;
        setWardrobe(list); setDefaults(defs);
        const st = emptyPalState();
        SLOTS.forEach((sl) => { if (pals[sl.key]) { st.pal[sl.key] = pals[sl.key]; st.custom[sl.key] = true; } });
        setPalState(st);
        if (defs) setHexes(defs);   // pengguna sudah punya default -> tampilkan; kalau belum, pakai bawaan
        setAuthOpen(false);
      } catch (e) { showToast(tr("Failed to load account data: {msg}", { msg: e.message })); }
      finally { if (!cancelled) setSyncing(false); }
    })();
    return () => { cancelled = true; };
  }, [uid]);

  /* ---- Palet pribadi per slot: tambah / ubah / hapus / kembalikan bawaan ---- */
  useEffect(() => {   // mode tanpa Supabase: simpan di browser
    if (sb) return;
    const out = {};
    SLOTS.forEach((sl) => { if (palState.custom[sl.key]) out[sl.key] = palState.pal[sl.key]; });
    try { localStorage.setItem(PAL_KEY, JSON.stringify(out)); } catch {}
  }, [palState]);

  const setSlotPal = (slot, list, custom) => setPalState((st) => ({ pal: { ...st.pal, [slot]: list }, custom: { ...st.custom, [slot]: custom } }));
  // Perubahan pertama pada palet bawaan: salin dulu ke akun pengguna agar bisa diedit
  const materialize = async (slot) => {
    if (palState.custom[slot]) return palState.pal[slot];
    let list = palState.pal[slot].map((c) => ({ ...c }));
    if (uid) list = (await DB.insertPalette(slot, list.map((c, i) => ({ name: c.name, hex: c.hex, sort_order: i })))).map(rowToColor);
    return list;
  };
  const palOp = async (fn) => { try { await fn(); return true; } catch (e) { showToast(tr("Failed to update palette: {msg}", { msg: e.message })); return false; } };
  const addColor = (slot, { name, hex }) => palOp(async () => {
    const list = await materialize(slot);
    let item = { id: "c" + Date.now().toString(36), name, hex };
    if (uid && list.length === 0) await DB.clearEmptyMark(uid, slot);
    if (uid) item = rowToColor((await DB.insertPalette(slot, [{ name, hex, sort_order: list.length }]))[0]);
    setSlotPal(slot, [...list, item], true);
  });
  const updateColor = (slot, idx, { name, hex }) => palOp(async () => {
    const list = await materialize(slot);
    if (uid) await DB.updatePalette(list[idx].id, { name, hex });
    setSlotPal(slot, list.map((c, i) => (i === idx ? { ...c, name, hex } : c)), true);
  });
  const removeColors = (slot, idxs) => palOp(async () => {
    const list = await materialize(slot);
    const next = list.filter((_, i) => !idxs.includes(i));
    if (uid) {
      await DB.deletePaletteMany(idxs.map((i) => list[i].id));
      if (!next.length) await DB.insertPalette(slot, [{ name: EMPTY_MARK, hex: "#000000", sort_order: 0 }]);
    }
    setSlotPal(slot, next, true);
    if (idxs.length > 1) showToast(tr("{n} colors deleted", { n: idxs.length }));
  });
  const removeColor = (slot, idx) => removeColors(slot, [idx]);
  const resetPalette = (slot) => palOp(async () => {
    if (uid && palState.custom[slot]) await DB.resetPalette(uid, slot);
    setSlotPal(slot, defaultPalette(), false);
    showToast(tr("Palette restored to default"));
  });
  const openEdit = (i) => {
    if (sb && !uid) { showToast(tr("Sign in first to create your own color palette")); setAuthOpen(true); return; }
    setEditSlot(i);
  };

  /* Riwayat perubahan warna (undo / redo), animasi acak tidak ikut tercatat */
  useEffect(() => {
    if (shuffling) return;
    if (skipRef.current) { skipRef.current = false; lastRef.current = hexes; return; }
    if (lastRef.current.join() === hexes.join()) return;
    const prev = lastRef.current;
    setHistory((h) => ({ past: [...h.past.slice(-29), prev], future: [] }));
    lastRef.current = hexes;
  }, [hexes, shuffling]);
  const undo = () => {
    if (!history.past.length) return;
    const prev = history.past[history.past.length - 1];
    skipRef.current = true;
    setHistory({ past: history.past.slice(0, -1), future: [hexes, ...history.future] });
    setHexes(prev);
  };
  const redo = () => {
    if (!history.future.length) return;
    const next = history.future[0];
    skipRef.current = true;
    setHistory({ past: [...history.past, hexes], future: history.future.slice(1) });
    setHexes(next);
  };

  const surprise = () => {
    if (shuffling) return;
    if (locks.every(Boolean)) return showToast(tr("All slots are locked. Unlock one first 🔓"));
    setShuffling(true);
    const final = randomOutfit(hexes, locks, palArrays);
    let tick = 0;
    const iv = setInterval(() => {
      if (++tick >= 9) { clearInterval(iv); setHexes(final); setShuffling(false); return; }
      setHexes((p) => p.map((h, i) => (locks[i] ? h : randFrom(palArrays[i]))));
    }, 75);
  };

  const save = async () => {
    const item = { id: Date.now().toString(36), colors: hexes, score: an.score, vibe, tag: null, date: fmtDate(new Date()), ts: Date.now() };
    if (uid) {
      try { const it = await DB.addOutfit(item); setWardrobe((w) => [it, ...w]); showToast(tr("Outfit saved to your account ✨")); }
      catch (e) { showToast(tr("Failed to save: {msg}", { msg: e.message })); }
    } else { commitLocal([item, ...wardrobe]); showToast(tr("Outfit saved to your wardrobe ✨")); }
  };

  const removeOutfit = async (id) => {
    if (!uid) return commitLocal(wardrobe.filter((x) => x.id !== id));
    try { await DB.removeOutfit(id); setWardrobe((w) => w.filter((x) => x.id !== id)); }
    catch (e) { showToast(tr("Failed to delete: {msg}", { msg: e.message })); }
  };

  const removeOutfits = async (ids) => {
    if (!uid) { commitLocal(wardrobe.filter((x) => !ids.includes(x.id))); showToast(tr("{n} outfits deleted", { n: ids.length })); return true; }
    try { await DB.removeOutfits(ids); setWardrobe((w) => w.filter((x) => !ids.includes(x.id))); showToast(tr("{n} outfits deleted", { n: ids.length })); return true; }
    catch (e) { showToast(tr("Failed to delete: {msg}", { msg: e.message })); return false; }
  };

  const tagOutfit = async (id, tag) => {
    const next = wardrobe.map((x) => (x.id === id ? { ...x, tag } : x));
    if (!uid) return commitLocal(next);
    const prev = wardrobe; setWardrobe(next);
    try { await DB.setTag(id, tag); } catch (e) { setWardrobe(prev); showToast(tr("Failed to change tag: {msg}", { msg: e.message })); }
  };

  const useAgain = (it) => {
    setHexes(it.colors); setLocks([false, false, false]); setTab("lab");
    showToast(tr("Outfit loaded into Mix Lab"));
  };

  const saveDefaults = async () => {
    try { await DB.saveDefaults(uid, hexes); setDefaults([...hexes]); showToast(tr("Default colors saved to your account")); }
    catch (e) { showToast(tr("Failed to save defaults: {msg}", { msg: e.message })); }
  };
  const resetDefaults = async () => {
    try { await DB.resetDefaults(uid); setDefaults(null); setHexes(DEFAULT_HEX); showToast(tr("Back to the default colors")); }
    catch (e) { showToast(tr("Failed to reset: {msg}", { msg: e.message })); }
  };
  const signOut = async () => { await sb.auth.signOut(); setAuthOpen(false); showToast(tr("You've signed out")); };

  const initial = user ? (((user.user_metadata && (user.user_metadata.full_name || user.user_metadata.name)) || user.email || "?")[0] || "?").toUpperCase() : null;

  return (
    <div className="mx-auto min-h-screen max-w-xl text-stone-800" style={{ fontFamily: "'Nunito', ui-sans-serif, system-ui, 'Segoe UI', sans-serif" }}>
      <header className="px-4 pt-3">
        <div className="flex items-center justify-between gap-2">
          <h1 className="font-display text-[21px] font-bold leading-tight tracking-tight text-stone-800">PaduPadan <span className="italic text-rose-500">for Hijabi</span></h1>
          <div className="flex shrink-0 items-center gap-1.5">
            <button onClick={toggleLang} aria-label={tr("Language: {lang}. Tap to switch.", { lang: lang === "en" ? "English" : "Bahasa Indonesia" })} title={lang === "en" ? "English" : "Bahasa Indonesia"}
              className="flex h-10 w-10 items-center justify-center rounded-full bg-stone-200/70 text-xs font-extrabold tracking-wide text-stone-600 transition active:scale-90">
              {lang.toUpperCase()}
            </button>
            <button onClick={cycleTheme} aria-label={tr("Theme: {mode}. Tap to change", { mode: tr({ auto: "automatic", light: "light", dark: "dark" }[theme]) })} title={tr("Change theme")}
              className="flex h-10 w-10 items-center justify-center rounded-full bg-stone-200/70 text-stone-600 transition active:scale-90">
              <Icon name={{ auto: "monitor", light: "sun", dark: "moon" }[theme]} size={17} />
            </button>
            <button onClick={() => setAuthOpen(true)} aria-label={user ? tr("My account") : tr("Sign in")}
              className={`flex h-10 w-10 items-center justify-center rounded-full text-sm font-extrabold transition active:scale-90 ${syncing ? "animate-pulse" : ""} ${user ? "bg-rose-500 text-white" : "bg-stone-200/70 text-stone-600"}`}>
              {user ? initial : <Icon name="user" size={16} />}
            </button>
          </div>
        </div>
      </header>
      <div className="sticky top-0 z-20 bg-[#fcf5f5]/90 px-4 pb-2 pt-2 backdrop-blur">
        <nav className="grid grid-cols-2 gap-1 rounded-2xl bg-stone-200/70 p-1">
          {[["lab", "Mix Lab", "palette"], ["wardrobe", `${tr("Wardrobe")}${wardrobe.length ? ` (${wardrobe.length})` : ""}`, "archive"]].map(([k, l, ic]) => (
            <button key={k} onClick={() => setTab(k)} aria-current={tab === k ? "page" : undefined}
              className={`flex h-10 items-center justify-center gap-2 rounded-xl text-sm font-bold transition ${tab === k ? "bg-white text-stone-900 shadow" : "text-stone-500"}`}>
              <Icon name={ic} size={16} /> {l}
            </button>
          ))}
        </nav>
      </div>

      <main className="px-4 pb-10 pt-2" style={{ paddingBottom: "max(2.5rem, env(safe-area-inset-bottom))" }}>
        {tab === "lab" ? (
          <div className="slide-up">
            {/* Ringkasan: manekin + skor + aksi utama dalam satu layar */}
            <section className="flex gap-3 rounded-3xl bg-white p-3 shadow-sm ring-1 ring-stone-200">
              <div className="relative w-[128px] shrink-0 rounded-2xl bg-[#f7e8ec] p-1.5 min-[400px]:w-[150px]" style={{ height: 292 }}>
                <Mannequin hexes={hexes} active={active} onSelect={setActive} />
                <div className="absolute right-1.5 top-1.5 flex flex-col gap-1.5">
                  <button onClick={undo} disabled={!history.past.length} aria-label={tr("Undo color change")} title={tr("Undo")}
                    className="flex h-9 w-9 items-center justify-center rounded-full bg-white/90 text-stone-700 shadow-sm ring-1 ring-stone-200 transition active:scale-90 disabled:opacity-35"><Icon name="undo" size={15} /></button>
                  <button onClick={redo} disabled={!history.future.length} aria-label={tr("Redo color change")} title={tr("Redo")}
                    className="flex h-9 w-9 items-center justify-center rounded-full bg-white/90 text-stone-700 shadow-sm ring-1 ring-stone-200 transition active:scale-90 disabled:opacity-35"><Icon name="redo" size={15} /></button>
                </div>
              </div>
              <div className="flex min-w-0 flex-1 flex-col">
                <div className="flex items-center gap-2.5">
                  <ScoreRing score={an.score} />
                  <div className="min-w-0">
                    <p className="text-[11px] font-semibold uppercase tracking-wide text-stone-400">{tr("Match score")}</p>
                    <p className="truncate text-base font-extrabold leading-tight">{vibeText(vibe)}</p>
                  </div>
                </div>
                <span className="mt-2 self-start rounded-full px-2.5 py-0.5 text-[11px] font-bold transition-colors" style={{ color: tone.c, backgroundColor: tone.bg }}>{tone.t}</span>
                <p className="mt-2 border-l-4 pl-2.5 text-xs leading-relaxed text-stone-600 transition-colors" style={{ borderColor: tone.c }}>{tip}</p>
                {fixes[0] && (
                  <button onClick={() => { setColor(fixes[0].slot, fixes[0].color.hex); setActive(fixes[0].slot); showToast(tr("{slot} changed to {color}", { slot: SLOTS[fixes[0].slot].short, color: fixes[0].color.name })); }}
                    className="mt-2 flex items-center gap-2 self-start rounded-2xl bg-stone-50 py-1 pl-1 pr-2.5 text-[11px] font-bold ring-1 ring-stone-200 transition active:scale-95">
                    <span className="h-5 w-5 rounded-full ring-1 ring-black/10" style={{ backgroundColor: fixes[0].color.hex }} />
                    <span className="truncate">{SLOTS[fixes[0].slot].short} → {fixes[0].color.name}</span>
                    <span className="text-green-600">+{fixes[0].gain}%</span>
                  </button>
                )}
                <div className="mt-auto flex gap-2 pt-3">
                  <button onClick={surprise} disabled={shuffling}
                    className="flex h-11 flex-1 items-center justify-center gap-1.5 rounded-2xl bg-rose-500 hover:bg-rose-600 text-sm font-extrabold text-white shadow-md transition active:scale-95 disabled:opacity-70">
                    <span className={shuffling ? "spin-once" : ""}><Icon name="sparkles" size={17} /></span> {tr("Surprise")}
                  </button>
                  <button onClick={save} aria-label={tr("Save outfit to wardrobe")} title={tr("Save to wardrobe")}
                    className="flex h-11 w-11 items-center justify-center rounded-2xl bg-stone-900 text-white transition active:scale-95"><Icon name="save" size={17} /></button>
                </div>
              </div>
            </section>

            <div className="mb-2 mt-4 flex items-center justify-between">
              <h2 className="text-sm font-extrabold">{tr("Adjust colors")}</h2>
              <button onClick={() => setScanOpen(true)} className="flex items-center gap-1.5 rounded-xl bg-rose-50 px-3 py-2 text-xs font-bold text-rose-600 ring-1 ring-rose-100 transition active:scale-95">
                <Icon name="camera" size={14} /> {tr("Scan from photo")}
              </button>
            </div>
            <div className="flex flex-col gap-2">
              {SLOTS.map((s, i) => (
                <SlotCard key={s.key} slot={s} hex={hexes[i]} palette={palState.pal[s.key]} onEdit={() => openEdit(i)} locked={locks[i]} active={active === i}
                  onSelect={() => setActive(i)} onPick={(h) => setColor(i, h)} onToggleLock={() => toggleLock(i)} />
              ))}
            </div>

            <Accordion title={tr("Score details")} summary={`${an.score}% · ${tone.t}`}>
              <ScoreBreakdown an={an} fixes={fixes} notes={getNotes(an, hexes)} allLocked={locks.every(Boolean)}
                onApply={(i, hex) => { setColor(i, hex); setActive(i); showToast(tr("{slot} changed to {color}", { slot: SLOTS[i].short, color: colorName(hex) })); }} />
            </Accordion>
            <Accordion title={tr("Default colors")} summary={defaults ? tr("Yours") : tr("Built-in")}>
              <DefaultsCard user={user} defaults={defaults} onSave={saveDefaults} onLogin={() => setAuthOpen(true)}
                onApply={() => { setHexes(defaults || DEFAULT_HEX); setLocks([false, false, false]); }} onReset={resetDefaults} />
            </Accordion>
          </div>
        ) : (
          <>
            {sb && !user && (
              <div className="mb-3 flex items-center justify-between gap-3 rounded-2xl bg-white p-3 text-xs ring-1 ring-stone-200">
                <span className="text-stone-600">{tr("Sign in so your wardrobe is saved to your account and follows you across devices.")}</span>
                <button onClick={() => setAuthOpen(true)} className="shrink-0 rounded-xl bg-stone-900 px-3 py-2 font-bold text-white">{tr("Sign in")}</button>
              </div>
            )}
            <Wardrobe items={wardrobe} onUse={useAgain} onDelete={removeOutfit} onDeleteMany={removeOutfits} onTag={tagOutfit} />
          </>
        )}
      </main>

      <ScanModal open={scanOpen} onClose={() => setScanOpen(false)} locks={locks} initialSlot={active}
        onApply={(i, hex) => { setColor(i, hex); setActive(i); showToast(tr("Color {hex} applied to {slot}", { hex, slot: SLOTS[i].short })); }} />
      {editSlot !== null && (
        <PaletteModal slot={SLOTS[editSlot]} list={palState.pal[SLOTS[editSlot].key]} isCustom={!!palState.custom[SLOTS[editSlot].key]}
          onClose={() => setEditSlot(null)}
          onAdd={(c) => addColor(SLOTS[editSlot].key, c)} onUpdate={(i, c) => updateColor(SLOTS[editSlot].key, i, c)}
          onRemove={(i) => removeColor(SLOTS[editSlot].key, i)} onRemoveMany={(idxs) => removeColors(SLOTS[editSlot].key, idxs)} onReset={() => resetPalette(SLOTS[editSlot].key)} />
      )}
      <AuthModal open={authOpen} onClose={() => setAuthOpen(false)} user={user} onSignOut={signOut} />

      {toast && <div className="slide-up fixed left-1/2 top-16 z-[60] max-w-[92vw] -translate-x-1/2 rounded-full bg-stone-900 px-4 py-2 text-center text-sm font-semibold text-white shadow-lg">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
